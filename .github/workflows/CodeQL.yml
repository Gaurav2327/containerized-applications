name: "SAST"

on:
  pull_request:
    branches: ["**"]

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  codeQL-analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          project-path: ./python
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  sonar-scan:
    name: SonarQube SAST
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set up python code
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: install dependencies
        run: |
          cd python
          pip install -r ../requirements.txt

      - name: run tests with coverage
        run: |
          cd python
          pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term

      - name: verify coverage file
        run: |
          ls -la python/coverage.xml
          cat python/coverage.xml

      - name: sonarqube scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=Gaurav2327_containerized-applications
            -Dsonar.projectName=containerized-applications
            -Dsonar.organization=gaurav2327
            -Dsonar.sources=python
            -Dsonar.exclusions=**/*test*.py,**/test_*.py,**/*.pyc,**/__pycache__/**
            -Dsonar.tests=python
            -Dsonar.test.inclusions=**/*test*.py,**/test_*.py
            -Dsonar.python.coverage.reportPaths=python/coverage.xml
            -Dsonar.python.version=3.10