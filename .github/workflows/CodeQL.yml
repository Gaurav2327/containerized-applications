name: "SAST"

on:
  pull_request:
    branches: ["**"]

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  codeQL-analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python']
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          project-path: ./python
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  sonar-scan:
    name: SonarQube SAST
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set up python code
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run tests with coverage
        run: |
          cd python
          python -m pytest --cov=app --cov-report=xml --cov-report=term -v test_app.py
          mv coverage.xml ../coverage.xml
        continue-on-error: false

      - name: fix coverage paths for SonarCloud
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          
          # Fix source paths
          for source in root.findall('.//sources/source'):
              source.text = '.'
          
          # Fix file paths to include python/ prefix
          for pkg in root.findall('.//packages/package'):
              for cls in pkg.findall('.//class'):
                  filename = cls.get('filename')
                  if filename and not filename.startswith('python/'):
                      cls.set('filename', f'python/{filename}')
          
          tree.write('coverage.xml', encoding='utf-8', xml_declaration=True)
          print("Fixed coverage paths")
          EOF

      - name: verify coverage file
        run: |
          echo "Coverage paths after fix:"
          grep 'filename=' coverage.xml | head -5

      - name: sonarqube scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=Gaurav2327_containerized-applications
            -Dsonar.projectName=containerized-applications
            -Dsonar.organization=gaurav2327
            -Dsonar.sources=python
            -Dsonar.exclusions=**/test_*.py
            -Dsonar.tests=python
            -Dsonar.test.inclusions=**/test_*.py
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.10
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.verbose=true