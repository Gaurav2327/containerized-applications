name: build and push docker image
on:
  workflow_dispatch

jobs:
  python-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build docker image
        run: docker build -t ${{ secrets.DOCKER_USER }}/myapp:${{ github.sha }} .

      - name: scan image
        uses: aquasecurity/trivy@0.25.0
        with:
          image: ${{ secrets.DOCKER_USER }}/myapp:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: docker push
        run: docker push ${{ secrets.DOCKER_USER }}/myapp:${{ github.sha }}