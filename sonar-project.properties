# Sonar Project Configuration
sonar.projectKey=containerized-applications
sonar.projectName=Containerized Applications
sonar.projectVersion=1.0

# Source code location
sonar.sources=python/app.py
sonar.tests=python/test_app.py

# Python specific settings
sonar.language=py
sonar.sourceEncoding=UTF-8

# Coverage reports
sonar.python.coverage.reportPaths=python/coverage.xml
sonar.python.xunit.reportPath=python/test-results.xml

# Exclude files from analysis
sonar.exclusions=**/test_*.py,**/templates/**,**/static/**,terraform/**,**/venv/**,**/__pycache__/**,**/htmlcov/**

# Test coverage exclusions
sonar.coverage.exclusions=**/test_*.py,**/templates/**,**/static/**,terraform/**

# Additional settings for code quality
sonar.python.version=3.11

